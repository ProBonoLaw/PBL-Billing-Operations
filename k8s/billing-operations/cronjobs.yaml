apiVersion: batch/v1
kind: CronJob
metadata:
  name: aimie-stats-retriever
  namespace: billing-operations
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: billing-operations
          restartPolicy: Never
          volumes:
            - name: appsettings
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: billing-operations-appsettings
          containers:
            - name: worker
              image: <image-repository>:<image-tag>
              env:
                - name: ROLE
                  value: aimie-stats
              volumeMounts:
                - name: appsettings
                  mountPath: /mnt/keyvault
                  readOnly: true
              resources:
                requests: {cpu: 25m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
---
