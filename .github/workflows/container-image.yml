name: Container image

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - src/**
      - tests/**
      - k8s/**
      - .github/workflows/container-image.yml

env:
  IMAGE_NAME: billing-operations

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test private repository integration
        run: python3 -m unittest discover -s .github/tests -v
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/BillingOperations.Tests/BillingOperations.Tests.csproj -c Release

  build-pull-request:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}

  publish:
    if: github.event.repository.private == true && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: test
    env:
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
      ACR_NAME: ${{ vars.ACR_NAME }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" --name "$ACR_NAME"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=main
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
